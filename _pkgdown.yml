url: https://jameshwade.github.io/shinymcp/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#39729e"
    base_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

home:
  title: shinymcp
  description: Build MCP Apps for AI chat clients from R functions and Shiny UI.

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, lightswitch, github]

articles:
  - title: Guides
    navbar: ~
    contents:
      - tools
      - deployment
      - hosting
      - rewriting-as-tools
  - title: More
    navbar: More
    contents:
      - shiny-apps
      - protocol
      - troubleshooting

reference:
  - title: Make an app
    contents:
      - mcp_app
      - mcp_tool_module
      - McpApp

  - title: UI
    contents:
      - mcp_select
      - mcp_plot
      - mcp_submit_button
      - mcp_input
      - mcp_output

  - title: Tools and their results
    contents:
      - mcp_result
      - mcp_tool_result
      - mcp_request

  - title: Run it
    contents:
      - serve
      - mcp_endpoint
      - preview_app
      - shinymcp-options

  - title: Show it in Shiny and shinychat
    contents:
      - as_shinychat_tool
      - mcp_host_ui

  - title: Serving a Shiny app as it is
    desc: >
      For serving an existing Shiny app live, until Shiny's own MCP support
      is released. Outside an MCP App, the helpers for server functions do
      nothing, so the app still runs as usual.
    contents:
      - as_mcp_app
      - bindMcp
      - mcp_model_context
      - mcp_host_context

  - title: Pages built by hand
    contents:
      - bridge_script_tag

  - title: internal
    contents:
      - shinymcp-package
