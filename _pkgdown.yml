url: https://jameshwade.github.io/shinymcp/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#39729e"
    base_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

home:
  title: shinymcp
  description: Serve Shiny apps as MCP Apps in AI chat clients.

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, lightswitch, github]

articles:
  - title: Guides
    navbar: ~
    contents:
      - shiny-apps
      - tools
      - deployment
      - hosting
  - title: More
    navbar: More
    contents:
      - rewriting-as-tools
      - protocol
      - troubleshooting

reference:
  - title: Make an app
    contents:
      - as_mcp_app
      - mcp_app
      - mcp_tool_module
      - bindMcp
      - McpApp

  - title: Run it
    contents:
      - serve
      - mcp_endpoint
      - preview_app

  - title: Show it in Shiny and shinychat
    contents:
      - as_shinychat_tool
      - mcp_host_ui

  - title: Inside a Shiny app's server function
    desc: >
      For Shiny apps served with `as_mcp_app()`. Outside an MCP App they do
      nothing, so the app still runs as usual.
    contents:
      - mcp_model_context
      - mcp_host_context
      - mcp_request

  - title: UI for apps built from tools
    contents:
      - mcp_select
      - mcp_plot
      - mcp_submit_button
      - mcp_input
      - mcp_output

  - title: Tool results
    contents:
      - mcp_result
      - mcp_tool_result

  - title: Rewriting a Shiny app as tools
    contents:
      - convert_app
      - as_mcp_apps
      - parse_shiny_app
      - analyze_reactive_graph
      - generate_mcp_app

  - title: Pages built by hand
    contents:
      - bridge_script_tag

  - title: internal
    contents:
      - shinymcp-package
